<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    margin: 20px;
}
.card {
    background: white;
    padding: 20px;
    margin: 15px auto;
    border-radius: 10px;
    max-width: 900px;
}
input {
    padding: 8px;
    width: 70%;
}
button {
    padding: 6px 10px;
    margin: 2px;
    cursor: pointer;
}
.delete { background:red; color:white;}
.edit { background:orange; color:white;}
table {
    width: 100%;
}
th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="card">
<h2>📅 Mês</h2>
<input type="month" id="mesSelecionado">
</div>

<div class="card">
<h2>👤 Usuário</h2>
<select id="usuario">
<option>Rodrigo</option>
<option>Bruna</option>
<option>Júlia</option>
</select>
</div>

<div class="card">
<h2>➕ Lançamento</h2>
<input type="text" id="entrada" placeholder="Ex: recebi 5000 ou gastei 200 mercado">
<button onclick="adicionarTexto()">Adicionar</button>
<button onclick="falar()">🎤 Falar</button>
<p id="texto"></p>
</div>

<div class="card">
<h2>💰 Resumo</h2>
<p id="resumo"></p>
</div>

<div class="card">
<h2>📋 Lançamentos</h2>
<table id="tabela">
<tr>
<th>Pessoa</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Ações</th>
</tr>
</table>
</div>

<div class="card">
<h2>📊 Gráfico</h2>
<canvas id="grafico"></canvas>
</div>

<script>

// ===== MÊS =====
let mesAtual = new Date().toISOString().slice(0,7);
document.getElementById("mesSelecionado").value = mesAtual;

// ===== BASE INICIAL (só na primeira vez)
let dadosBase = [
{usuario:"Rodrigo", tipo:"receita", categoria:"Receita", descricao:"Receita mensal", valor:16000, mes:mesAtual},
{usuario:"Rodrigo", tipo:"despesa", categoria:"Moradia", descricao:"Condomínio", valor:790, mes:mesAtual}
];

// ===== CARREGAR SEM PERDER HISTÓRICO
let dadosLocal = JSON.parse(localStorage.getItem("dados"));
let dados = (dadosLocal && dadosLocal.length > 0) ? dadosLocal : dadosBase;

function salvar(){
    localStorage.setItem("dados", JSON.stringify(dados));
}

// ===== IDENTIFICAR TIPO
function identificarTipo(texto){

    const receitas = ["recebi","ganhei","entrou","faturei","salário"];
    const despesas = ["gastei","paguei","comprei"];

    if(receitas.some(p=>texto.includes(p))) return "receita";
    if(despesas.some(p=>texto.includes(p))) return "despesa";

    return "despesa";
}

// ===== CLASSIFICAR
function classificar(texto){

    let valor = parseFloat((texto.match(/\d+/) || [0])[0]);

    let categoria="Outros";

    if(texto.includes("mercado")||texto.includes("padaria")||texto.includes("lanche")) categoria="Alimentação";
    if(texto.includes("gasolina")) categoria="Transporte";
    if(texto.includes("escola")) categoria="Família";
    if(texto.includes("plano")) categoria="Saúde";
    if(texto.includes("consórcio")||texto.includes("empréstimo")) categoria="Dívidas";

    return {valor,categoria};
}

// ===== ATUALIZAR
function atualizar(){

    let mes = document.getElementById("mesSelecionado").value;

    let tabela = document.getElementById("tabela");
    tabela.innerHTML = `
    <tr>
    <th>Pessoa</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Ações</th>
    </tr>`;

    let receita=0, despesa=0, categorias={};

    dados.forEach((d,index)=>{

        if(d.mes !== mes) return;

        if(d.tipo==="receita") receita+=d.valor;
        else{
            despesa+=d.valor;
            categorias[d.categoria]=(categorias[d.categoria]||0)+d.valor;
        }

        let row = tabela.insertRow();

        row.insertCell(0).innerText=d.usuario;
        row.insertCell(1).innerText=d.tipo;
        row.insertCell(2).innerText=d.categoria;
        row.insertCell(3).innerText=d.descricao;
        row.insertCell(4).innerText="R$ "+d.valor;

        row.insertCell(5).innerHTML=`
            <button class="edit" onclick="editar(${index})">✏️</button>
            <button class="delete" onclick="excluir(${index})">🗑️</button>
        `;
    });

    document.getElementById("resumo").innerText =
        `Receita: R$ ${receita} | Despesas: R$ ${despesa} | Saldo: R$ ${receita-despesa}`;

    grafico.data.labels = Object.keys(categorias);
    grafico.data.datasets[0].data = Object.values(categorias);
    grafico.update();
}

// ===== ADICIONAR
function adicionarTexto(){

    let texto = document.getElementById("entrada").value.toLowerCase();
    if(!texto) return alert("Digite algo");

    let user = document.getElementById("usuario").value;
    let mes = document.getElementById("mesSelecionado").value;

    let tipo = identificarTipo(texto);
    let info = classificar(texto);

    if(info.valor===0) return alert("Valor não identificado");

    dados.push({
        usuario:user,
        tipo:tipo,
        categoria: tipo==="receita" ? "Receita" : info.categoria,
        descricao:texto,
        valor:info.valor,
        mes:mes
    });

    salvar();
    atualizar();

    document.getElementById("entrada").value="";
}

// ===== EDITAR
function editar(index){

    let novo = prompt("Novo valor:", dados[index].valor);

    if(novo){
        dados[index].valor = parseFloat(novo);
        salvar();
        atualizar();
    }
}

// ===== EXCLUIR
function excluir(index){

    if(confirm("Excluir lançamento?")){
        dados.splice(index,1);
        salvar();
        atualizar();
    }
}

// ===== VOZ
function falar(){

    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Use Chrome");
        return;
    }

    let rec = new SpeechRecognition();
    rec.lang="pt-BR";

    rec.start();

    rec.onresult=function(e){
        let texto=e.results[0][0].transcript.toLowerCase();
        document.getElementById("texto").innerText=texto;
        adicionarTexto(texto);
    }
}

// ===== GRÁFICO
const grafico = new Chart(document.getElementById("grafico"),{
    type:'doughnut',
    data:{
        labels:[],
        datasets:[{
            data:[],
            backgroundColor:[
                '#4CAF50','#F44336','#2196F3',
                '#9C27B0','#FFC107','#FF5722',
                '#009688','#3F51B5'
            ]
        }]
    }
});

// evento mês
document.getElementById("mesSelecionado").addEventListener("change", atualizar);

window.onload=atualizar;

</script>

</body>
</html>
