<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro Familiar</title>

<!-- ✅ Chart.js CORRETO -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    margin: 20px;
}
.card {
    background: white;
    padding: 20px;
    margin: 15px auto;
    border-radius: 10px;
    max-width: 900px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="card">
<h2>📅 Mês</h2>
<input type="month" id="mesSelecionado">
</div>

<div class="card">
<h2>👤 Usuário</h2>
<select id="usuario">
<option>Rodrigo</option>
<option>Bruna</option>
<option>Júlia</option>
</select>
</div>

<div class="card">
<h2>💰 Resumo</h2>
<p id="resumo"></p>
</div>

<div class="card">
<h2>📋 Lançamentos</h2>
<table id="tabela">
<tr><th>Pessoa</th><th>Categoria</th><th>Descrição</th><th>Valor</th></tr>
</table>
</div>

<div class="card">
<h2>📊 Distribuição</h2>
<canvas id="grafico"></canvas>
</div>

<script>

// ===== MÊS ATUAL =====
let hoje = new Date();
let mesAtual = hoje.toISOString().slice(0,7);
document.getElementById("mesSelecionado").value = mesAtual;

// ===== BASE COMPLETA DOS SEUS DADOS =====
let dadosBase = [

{usuario:"Rodrigo", categoria:"Receita", descricao:"Receita mensal", valor:16000, mes:mesAtual, tipo:"receita"},

// MORADIA
{usuario:"Rodrigo", categoria:"Moradia", descricao:"Condomínio", valor:790, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Moradia", descricao:"Energia", valor:250, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Moradia", descricao:"Gás", valor:50, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Moradia", descricao:"Seguro casa", valor:48, mes:mesAtual, tipo:"despesa"},

// TRANSPORTE
{usuario:"Rodrigo", categoria:"Transporte", descricao:"Prestação carro", valor:2578, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Transporte", descricao:"Seguro carro", valor:206, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Transporte", descricao:"Seguro bike", valor:214.30, mes:mesAtual, tipo:"despesa"},

// FAMÍLIA
{usuario:"Rodrigo", categoria:"Família", descricao:"Escola Júlia", valor:1400, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Família", descricao:"Vôlei Júlia", valor:200, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Família", descricao:"Psicóloga Júlia", valor:200, mes:mesAtual, tipo:"despesa"},

// SAÚDE
{usuario:"Rodrigo", categoria:"Saúde", descricao:"Plano de saúde", valor:1200, mes:mesAtual, tipo:"despesa"},

// ESTILO DE VIDA
{usuario:"Bruna", categoria:"Estilo de Vida", descricao:"Academia", valor:200, mes:mesAtual, tipo:"despesa"},

// DÍVIDAS
{usuario:"Rodrigo", categoria:"Dívidas", descricao:"Empréstimo ML", valor:1900, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Dívidas", descricao:"Consórcio", valor:630, mes:mesAtual, tipo:"despesa"},

// VARIÁVEIS
{usuario:"Rodrigo", categoria:"Alimentação", descricao:"Lanche", valor:50, mes:mesAtual, tipo:"despesa"},
{usuario:"Júlia", categoria:"Alimentação", descricao:"Padaria", valor:50, mes:mesAtual, tipo:"despesa"},
{usuario:"Rodrigo", categoria:"Alimentação", descricao:"Feira", valor:50, mes:mesAtual, tipo:"despesa"}

];

// ===== CARREGAMENTO COM PERSISTÊNCIA =====
let dadosLocal = JSON.parse(localStorage.getItem("dados"));

let dados = (dadosLocal && dadosLocal.length > 0)
    ? dadosLocal
    : dadosBase;

if(!dadosLocal){
    localStorage.setItem("dados", JSON.stringify(dados));
}

// ===== ATUALIZAR =====
function atualizar(){

    let mes = document.getElementById("mesSelecionado").value;

    let tabela = document.getElementById("tabela");
    tabela.innerHTML = "<tr><th>Pessoa</th><th>Categoria</th><th>Descrição</th><th>Valor</th></tr>";

    let receita = 0;
    let despesa = 0;
    let categorias = {};

    dados.forEach(d => {

        if(d.mes !== mes) return;

        if(d.tipo === "receita") {
            receita += d.valor;
        } else {
            despesa += d.valor;

            categorias[d.categoria] = (categorias[d.categoria] || 0) + d.valor;
        }

        let row = tabela.insertRow();
        row.insertCell(0).innerText = d.usuario;
        row.insertCell(1).innerText = d.categoria;
        row.insertCell(2).innerText = d.descricao;
        row.insertCell(3).innerText = "R$ " + d.valor;
    });

    let saldo = receita - despesa;

    document.getElementById("resumo").innerText =
        `Receita: R$ ${receita.toFixed(2)} | Despesas: R$ ${despesa.toFixed(2)} | Saldo: R$ ${saldo.toFixed(2)}`;

    grafico.data.labels = Object.keys(categorias);
    grafico.data.datasets[0].data = Object.values(categorias);
    grafico.update();
}

// ===== GRÁFICO =====
const grafico = new Chart(document.getElementById("grafico"), {
    type: 'doughnut',
    data: {
        labels: [],
        datasets: [{
            data: [],
            backgroundColor: [
                '#4CAF50','#F44336','#2196F3',
                '#9C27B0','#FFC107','#FF5722',
                '#009688','#3F51B5'
            ]
        }]
    }
});

// troca de mês
document.getElementById("mesSelecionado").addEventListener("change", atualizar);

// iniciar
window.onload = atualizar;

</script>

</body>
</html>
